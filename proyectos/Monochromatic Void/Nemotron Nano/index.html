<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Experiencia Liminal Zen</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: sans-serif;
}
#description {
  position: absolute;
  top: 10px;
  left: 10px;
  max-width: 300px;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  pointer-events: none;
  font-size: 0.9em;
  line-height: 1.4;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<canvas id="canvas" aria-label="Canvas for Liminal Zen experience"></canvas>
<div id="description" aria-live="polite">
Experiencia generativa de geometría espectral en escala de grises que respira con el movimiento del mouse.
</div>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const resize = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  };
  window.addEventListener('resize', resize);
  resize();
  const c = canvas;
  const w = c.width;
  const h = c.height;
  const N = 150; // number of particles
  const particles = Array.from({length:N}, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    radius: 0.5 + Math.random() * 2,
    speed: 0.5 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
    color: 200 // light gray
  }));
  const mouse = {x: w/2, y: h/2};
  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  const draw = () => {
    // Fade out previous frame
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, w, h);
    // Update particles
    particles.forEach(p => {
      p.phase += p.speed * 0.001;
      const baseX = Math.sin(p.phase) * 100;
      const baseY = Math.cos(p.phase) * 100;
      // Influence from mouse position
      const dx = (mouse.x - w/2) * 0.001;
      const dy = (mouse.y - h/2) * 0.001;
      p.x = (baseX + dx * 200) % w;
      p.y = (baseY + dy * 200) % h;
    });
    // Draw connections
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      const p1 = particles[i];
      for (let j = i + 1; j < N; j++) {
        const p2 = particles[j];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 80) {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  };
  draw();
})();
</script>
</body>
</html>
