<!DOCTYPE html>
<html lang="es" aria-label="Experiencia Liminal Zen – arte generativo monocromático">
<head>
<meta charset="UTF-8">
<title>Monochromatic Void – Experiencia Liminal Zen</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#fff;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  /* Texto de ayuda para lectores de pantalla */
  #description{
    position:absolute;left:-9999px;top:-9999px;
    width:1px;height:1px;overflow:hidden;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="description">
  Arte generativo monocromático que muestra una arquitectura fluida y espectral.
  Formas ondulantes emergen y respiran en respuesta sutil al movimiento del
  ratón o al tacto. El lienzo se adapta al tamaño de la ventana y mantiene
  60 fps usando requestAnimationFrame.
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;

  // Parámetros de la simulación
  const layers = 6;               // número de capas de ondas
  const points = 120;             // puntos por capa
  const speed = 0.0015;           // velocidad base de evolución
  const noiseScale = 0.0008;      // escala del ruido simple
  const mouse = {x: w/2, y: h/2};

  // Generador de ruido pseudo‑aleatorio (valor entre -1 y 1)
  function noise(x, y) {
    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return (n - Math.floor(n)) * 2 - 1;
  }

  // Redimensiona el lienzo y actualiza variables
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  // Captura movimiento del ratón / toque
  window.addEventListener('pointermove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  // Dibujar una capa de ondas
  function drawLayer(time, layer) {
    const t = time * speed + layer * 0.4;
    const amp = (h * 0.12) / (layer + 1);
    const hue = 255 - layer * 30; // escala de grises
    ctx.strokeStyle = `rgb(${hue},${hue},${hue})`;
    ctx.lineWidth = Math.max(1, 3 - layer * 0.4);
    ctx.beginPath();

    for (let i = 0; i <= points; i++) {
      const pct = i / points;
      const x = pct * w;
      // Ondas combinando seno y ruido, influenciadas por el mouse
      const yBase = h * 0.5 + Math.sin(pct * Math.PI * 2 + t) * amp;
      const yNoise = noise(x * noiseScale, t) * amp * 0.6;
      const yMouse = (mouse.y - h * 0.5) * 0.02 * Math.exp(-Math.abs(pct - mouse.x / w) * 8);
      const y = yBase + yNoise + yMouse;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Bucle de animación
  function animate(ts) {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < layers; i++) {
      drawLayer(ts, i);
    }
    requestAnimationFrame(animate);
  }

  // Iniciar
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
